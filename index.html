<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>МухиVSКотлеты</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; overflow: hidden; background-color: #f0f0f0; touch-action: none; height: 100vh; }
        
        #splash-screen { position: fixed; inset: 0; background: linear-gradient(135deg, #ffdde1, #d1e8ff); z-index: 300; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #main-logo { width: 200px; border-radius: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); margin-bottom: 30px; }

        .btn-start { padding: 15px 45px; font-size: 22px; background: #0088cc; color: white; border: none; border-radius: 18px; font-weight: bold; cursor: pointer; }
        
        #menu-overlay { position: fixed; inset: 0; background: white; z-index: 200; display: none; flex-direction: column; align-items: center; padding-top: 20px; overflow-y: auto; }
        .levels-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 20px; width: 85%; max-width: 400px; }
        .level-card { height: 60px; background: #e0e0e0; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #999; transition: 0.2s; }
        .level-card.open { background: #0088cc; color: white; box-shadow: 0 4px 10px rgba(0,136,204,0.2); }

        #game-area { position: relative; width: 100%; height: 100%; display: none; overflow: hidden; }
        .tap-zone { width: 50%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: bold; opacity: 0.3; font-size: 20px; }
        #zone-left { background: #ffdde1; } #zone-right { background: #d1e8ff; }
        
        .card-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }
        .card { width: 130px; height: 130px; background: white; border-radius: 35px; display: flex; align-items: center; justify-content: center; font-size: 70px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); transition: 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28); }
        .fly-left { transform: translate(-300%, -50%) rotate(-30deg); opacity: 0; }
        .fly-right { transform: translate(200%, -50%) rotate(30deg); opacity: 0; }

        /* УРОВЕНЬ 3: РАННЕР */
        #runner-area { position: absolute; inset: 0; display: none; background: #f9f9f9; }
        .lane { width: 33.33%; height: 100%; border-right: 1px solid rgba(0,0,0,0.05); float: left; position: relative; }
        #player-fly { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 60px; transition: left 0.2s cubic-bezier(0.4, 0, 0.2, 1); z-index: 15; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.2)); }
        .falling-item { position: absolute; top: -100px; left: 50%; transform: translateX(-50%); font-size: 50px; }

        #info-bar { position: absolute; top: 60px; width: 100%; display: flex; justify-content: center; gap: 8px; z-index: 50; pointer-events: none; }
        .info-item { background: rgba(255,255,255,0.9); padding: 5px 12px; border-radius: 15px; font-size: 13px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="logo.jpg" id="main-logo">
        <button class="btn-start" onclick="showMenu()">ИГРАТЬ</button>
    </div>

    <div id="menu-overlay">
        <h2 style="color: #0088cc">УРОВНИ</h2>
        <div class="levels-grid" id="levels-grid"></div>
        <button onclick="location.reload()" style="background:none; border:none; color:#999; margin-top:20px">На главную</button>
    </div>

    <div id="game-area">
        <div id="info-bar">
            <div id="timer-ui" class="info-item">⏳ 3.0с</div>
            <div id="score-ui" class="info-item">🏆 0</div>
            <div id="err-ui" class="info-item">❌ 0/15</div>
        </div>
        
        <div id="standard-mode" style="display:flex; height:100%; width:100%">
            <div class="tap-zone" id="zone-left" onclick="handleChoice('left')">МУХИ</div>
            <div class="tap-zone" id="zone-right" onclick="handleChoice('right')">КОТЛЕТЫ</div>
            <div class="card-container"><div id="card" class="card">🍔</div></div>
        </div>

        <div id="runner-mode">
            <div class="lane"></div><div class="lane"></div><div class="lane"></div>
            <div id="player-fly">🪰</div>
        </div>
    </div>

    <div id="finish-overlay" class="overlay">
        <div id="finish-content"></div>
        <button class="btn-start" onclick="showMenu()" style="margin-top:30px">ПРОДОЛЖИТЬ</button>
    </div>

    <audio id="snd-success" src="success.mp3" preload="auto"></audio>
    <audio id="snd-error" src="error.mp3" preload="auto"></audio>
    <audio id="snd-error-big" src="error1.mp3" preload="auto"></audio>
    <audio id="snd-ivan" src="ivan.mp3" preload="auto"></audio>
    <audio id="snd-win" src="win.mp3" preload="auto"></audio>
    <audio id="snd-lose" src="lose.mp3" preload="auto"></audio>

    <script>
        const tg = window.Telegram.WebApp;
        let unlocked = parseInt(localStorage.getItem('unlocked_v2')) || 1;
        let curLvl = 1, points = 0, timeLeft = 3, errors = 0, gameActive = false;
        let cutletsCount = 0, fliesCount = 0, totalSeconds = 0, gameLoop;
        let playerLane = 1, runnerSpeed = 5, spawnRate = 1000;

        function haptic(type) {
            try {
                if(type === 'light') tg.HapticFeedback.impactOccurred('light');
                if(type === 'heavy') tg.HapticFeedback.notificationOccurred('error');
                if(type === 'success') tg.HapticFeedback.notificationOccurred('success');
            } catch(e){}
        }

        function play(id) { 
            const s = document.getElementById(id); 
            if(s) { s.currentTime = 0; s.play().catch(()=>{}); } 
        }

        function showMenu() {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('finish-overlay').style.display = 'none';
            document.getElementById('game-area').style.display = 'none';
            document.getElementById('menu-overlay').style.display = 'flex';
            const grid = document.getElementById('levels-grid'); grid.innerHTML = '';
            for(let i=1; i<=10; i++) {
                let card = document.createElement('div');
                card.className = `level-card ${i <= unlocked ? 'open' : ''}`;
                card.innerText = i + (i > unlocked ? ' 🔒' : '');
                if(i <= unlocked) card.onclick = () => startLvl(i);
                grid.appendChild(card);
            }
        }

        function startLvl(lvl) {
            curLvl = lvl; points = 0; timeLeft = 3; errors = 0; totalSeconds = 0;
            cutletsCount = 0; fliesCount = 0; gameActive = true;
            document.getElementById('menu-overlay').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            
            if(lvl === 3) {
                initRunner();
            } else {
                document.getElementById('standard-mode').style.display = 'flex';
                document.getElementById('runner-mode').style.display = 'none';
                document.getElementById('err-ui').style.display = 'block';
                nextStandardItem();
                const timeFactor = lvl === 2 ? 0.7 : 1.0; 
                gameLoop = setInterval(() => {
                    timeLeft -= (0.1 * timeFactor); totalSeconds += 0.1;
                    document.getElementById('timer-ui').innerText = `⏳ ${Math.max(0, timeLeft).toFixed(1)}с`;
                    if(timeLeft <= 0) endGame('timeout');
                }, 100);
            }
        }

        // --- ЛОГИКА СОРТИРОВКИ (1, 2) ---
        let currentEmoji = '';
        function nextStandardItem() {
            const c = document.getElementById('card');
            c.className = 'card';
            if(Math.random() < 0.06) { currentEmoji = 'ivan'; c.innerText = '😷'; play('snd-ivan'); }
            else { 
                currentEmoji = Math.random() > 0.5 ? 'cutlet' : 'fly'; 
                c.innerText = currentEmoji === 'cutlet' ? '🍔' : '🪰'; 
            }
        }

        function handleChoice(side) {
            if(!gameActive) return;
            const isCorrect = (side === 'right' && currentEmoji === 'cutlet') || (side === 'left' && currentEmoji === 'fly');
            document.getElementById('card').classList.add(side === 'left' ? 'fly-left' : 'fly-right');

            if(currentEmoji === 'ivan') {
                if(side === 'right') {
                    alert("Иван успел купить пиво - котлеты в безопасности");
                    points += 5; haptic('light'); play('snd-success');
                } else {
                    alert("Иван не успел купить пиво и украл все котлеты");
                    haptic('heavy'); endGame('ivan'); return;
                }
            } else if(isCorrect) {
                points++; timeLeft += 0.8; haptic('light'); play('snd-success');
                if(currentEmoji === 'cutlet') cutletsCount++; else fliesCount++;
            } else {
                errors++; haptic('heavy'); play(errors % 5 === 0 ? 'snd-error-big' : 'snd-error');
                if(errors >= 15) { endGame('errors'); return; }
            }
            
            document.getElementById('score-ui').innerText = `🏆 ${points}/10`;
            document.getElementById('err-ui').innerText = `❌ ${errors}/15`;
            if(points >= 10) endGame('win'); else setTimeout(nextStandardItem, 200);
        }

        // --- ЛОГИКА РАННЕРА (3) ---
        let runnerInterval, speedInterval;
        function initRunner() {
            document.getElementById('standard-mode').style.display = 'none';
            document.getElementById('runner-mode').style.display = 'block';
            document.getElementById('err-ui').style.display = 'none';
            document.getElementById('timer-ui').innerText = "БЕГИ!";
            playerLane = 1; runnerSpeed = 5; spawnRate = 1000;
            updateFlyPosition();
            runnerInterval = setInterval(spawnItem, spawnRate);
            speedInterval = setInterval(() => { runnerSpeed += 0.5; }, 5000);
            gameLoop = setInterval(() => { totalSeconds += 0.1; }, 100);
        }

        function updateFlyPosition() {
            document.getElementById('player-fly').style.left = (16.66 + playerLane * 33.33) + '%';
        }

        function spawnItem() {
            if(!gameActive) return;
            const isEnemy = Math.random() > 0.6;
            const laneIdx = Math.floor(Math.random() * 3);
            const item = document.createElement('div');
            item.className = 'falling-item';
            item.innerText = isEnemy ? '🧹' : '🍔';
            document.querySelectorAll('.lane')[laneIdx].appendChild(item);

            let y = -100;
            let move = setInterval(() => {
                if(!gameActive) { clearInterval(move); item.remove(); return; }
                y += runnerSpeed;
                item.style.top = y + 'px';
                
                // Проверка столкновения (Муха в центре 50%)
                const screenMid = window.innerHeight / 2;
                if(y > screenMid - 60 && y < screenMid + 40 && laneIdx === playerLane) {
                    clearInterval(move); item.remove();
                    if(isEnemy) { haptic('heavy'); endGame('hit'); }
                    else { points++; cutletsCount++; haptic('light'); play('snd-success'); }
                    document.getElementById('score-ui').innerText = `🏆 ${points}`;
                }
                if(y > window.innerHeight) { clearInterval(move); item.remove(); }
            }, 20);
        }

        function endGame(reason) {
            gameActive = false;
            clearInterval(gameLoop); clearInterval(runnerInterval); clearInterval(speedInterval);
            const isWin = reason === 'win' || (curLvl === 3 && points >= 10);
            
            if(isWin) {
                if(curLvl === unlocked) unlocked++;
                localStorage.setItem('unlocked_v2', unlocked);
                play('snd-win'); haptic('success');
            } else {
                play('snd-lose'); haptic('heavy');
            }

            document.getElementById('finish-content').innerHTML = `
                <h1 style="color:${isWin?'#4caf50':'#ff5252'}">${isWin?'УРОВЕНЬ ПРОЙДЕН!':'КОНЕЦ ИГРЫ'}</h1>
                <p>Время: ${totalSeconds.toFixed(1)}с</p>
                <p>Счёт: ${points}</p>
                <div style="background:rgba(255,255,255,0.1); padding:15px; border-radius:15px; margin-top:10px">
                    <p>🍔 Собрано котлет: ${cutletsCount}</p>
                    <p>🪰 Отбито мух: ${fliesCount}</p>
                </div>
            `;
            document.getElementById('finish-overlay').style.display = 'flex';
        }

        // УПРАВЛЕНИЕ
        function movePlayer(dir) {
            if(!gameActive || curLvl !== 3) return;
            if(dir === 'left') playerLane = Math.max(0, playerLane - 1);
            else playerLane = Math.min(2, playerLane + 1);
            updateFlyPosition();
            haptic('light');
        }

        document.addEventListener('keydown', e => {
            if(e.key === 'ArrowLeft') curLvl === 3 ? movePlayer('left') : handleChoice('left');
            if(e.key === 'ArrowRight') curLvl === 3 ? movePlayer('right') : handleChoice('right');
        });

        let tsX = 0;
        document.addEventListener('touchstart', e => tsX = e.touches[0].clientX);
        document.addEventListener('touchend', e => {
            let dx = e.changedTouches[0].clientX - tsX;
            if(Math.abs(dx) > 40) {
                let side = dx < 0 ? 'left' : 'right';
                curLvl === 3 ? movePlayer(side) : handleChoice(side);
            }
        });
    </script>
</body>
</html>
