<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>МухиVSКотлеты</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; overflow: hidden; background-color: #f0f0f0; color: #333; height: 100vh; width: 100vw; }
        
        /* ЭКРАН ЗАСТАВКИ */
        #splash-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(135deg, #ffdde1 0%, #d1e8ff 100%);
            z-index: 300; display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; cursor: pointer;
        }
        .splash-title { font-size: 48px; font-weight: 900; color: #333; margin-bottom: 10px; text-shadow: 2px 2px 0px #fff; }
        .splash-subtitle { font-size: 18px; color: #555; letter-spacing: 2px; }

        /* ГЛАВНОЕ МЕНЮ (Сетка уровней) */
        #menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 200; display: none; flex-direction: column; align-items: center; padding-top: 40px; }
        .levels-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 20px; max-width: 320px; }
        .level-card { width: 80px; height: 80px; background: #e0e0e0; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: #999; cursor: not-allowed; position: relative; transition: all 0.2s; border: 4px solid transparent; -webkit-tap-highlight-color: transparent; }
        .level-card.open { background: #0088cc; color: white; cursor: pointer; box-shadow: 0 4px 10px rgba(0,136,204,0.3); }
        .level-card.open:active { transform: scale(0.9); }
        .level-card.locked::after { content: '🔒'; font-size: 14px; position: absolute; bottom: 5px; right: 5px; }
        
        /* ИГРОВЫЕ ОВЕРЛЕИ */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 20px; box-sizing: border-box; }
        #error-overlay { background-color: rgba(217, 83, 79, 0.9); color: white; display: none; font-size: 40px; font-weight: bold; }
        #finish-overlay { background-color: rgba(0, 0, 0, 0.9); color: white; display: none; }
        
        /* ГЕЙМПЛЕЙ */
        #game-area { position: relative; width: 100%; height: 100%; display: none; }
        .tap-zone { width: 50%; height: 100%; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; padding-top: 30px; box-sizing: border-box; cursor: pointer; transition: background-color 0.3s; -webkit-tap-highlight-color: transparent; }
        #zone-left { background-color: #ffdde1; border-right: 2px solid rgba(0,0,0,0.05); }
        #zone-right { background-color: #d1e8ff; }
        .zone-label { font-size: 22px; font-weight: bold; text-transform: uppercase; color: rgba(0,0,0,0.3); margin-bottom: 5px; user-select: none; }
        .special-label { font-size: 26px; color: #ffeb3b; text-shadow: 2px 2px 4px #000; font-weight: 900; display: none; }
        
        #info-bar { position: absolute; top: 100px; width: 100%; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; pointer-events: none; z-index: 10; }
        .info-item { background: rgba(255, 255, 255, 0.9); padding: 5px 12px; border-radius: 15px; font-size: 13px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .card-container { position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); z-index: 5; }
        .card { width: 140px; height: 140px; background: white; border-radius: 30px; display: flex; align-items: center; justify-content: center; font-size: 65px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); transition: all 0.2s ease-out; }
        
        .btn-main { margin-top: 20px; padding: 12px 24px; border-radius: 12px; background: #0088cc; color: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="splash-screen" onclick="showMenu()">
        <div class="splash-title">МухиVSКотлеты</div>
        <div class="splash-subtitle">НАЖМИ, ЧТОБЫ ИГРАТЬ</div>
    </div>

    <div id="menu-overlay">
        <h1 style="color: #0088cc; margin-bottom: 5px;">УРОВНИ</h1>
        <div class="levels-grid" id="levels-grid"></div>
        <p id="coming-soon" style="display:none; color: #d9534f; font-weight: bold; margin-top: 20px; padding: 0 20px; text-align: center;">Новые уровни скоро выйдут!</p>
    </div>

    <audio id="snd-success" src="success.mp3" preload="auto"></audio>
    <audio id="snd-error" src="error.mp3" preload="auto"></audio>
    <audio id="snd-error-big" src="error1.mp3" preload="auto"></audio>
    <audio id="snd-ivan" src="ivan.mp3" preload="auto"></audio>
    <audio id="snd-win" src="win.mp3" preload="auto"></audio>
    <audio id="snd-lose" src="lose.mp3" preload="auto"></audio>

    <div id="error-overlay" class="overlay">ОШИБКА!</div>

    <div id="finish-overlay" class="overlay">
        <div id="finish-content"></div>
        <button class="btn-main" onclick="backToMenu()">К списку уровней</button>
    </div>

    <div id="game-area">
        <div id="info-bar">
            <div id="lvl-display" class="info-item" style="background: #0088cc; color: white;">УРОВЕНЬ 1</div>
            <div id="timer" class="info-item">⏳ 3.0с</div>
            <div id="score-points" class="info-item">🏆 0/10</div>
            <div id="cutlet-count" class="info-item">🥩 0/10</div>
            <div id="errors" class="info-item">❌ 0/15</div>
        </div>

        <div class="tap-zone" id="zone-left" onclick="handleChoice('left')">
            <div class="zone-label">Мухи</div>
            <div class="special-label" id="special-left">🍺 ПИВНУШКА</div>
        </div>
        <div class="tap-zone" id="zone-right" onclick="handleChoice('right')">
            <div class="zone-label">Котлеты</div>
            <div class="special-label" id="special-right">🍺 ПИВНУШКА</div>
        </div>

        <div class="card-container">
            <div id="card" class="card">🍔</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentLevel = 1;
        let unlockedLevels = parseInt(localStorage.getItem('unlockedLevels')) || 1;
        const totalLevelsInCode = 2; 
        
        let timeLeft = 3.0, errorCount = 0, totalTime = 0, points = 0;
        let cutletsProgress = 0, currentItem = '', beerSide = null, gameActive = false;
        let stats = { flies: 0, cutlets: 0 };
        let gameLoop;

        const levelConfig = {
            1: { target: 10, timeSpeed: 1.0, flyPenalty: 0.5 },
            2: { target: 10, timeSpeed: 1.4, flyPenalty: 0.7 } 
        };

        function showMenu() {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('menu-overlay').style.display = 'flex';
            initMenu();
        }

        function initMenu() {
            const grid = document.getElementById('levels-grid');
            grid.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                const card = document.createElement('div');
                const isOpen = i <= unlockedLevels;
                const isReady = i <= totalLevelsInCode;
                
                card.className = `level-card ${isOpen ? 'open' : 'locked'}`;
                card.innerText = i;
                
                if (isOpen) {
                    card.onclick = () => isReady ? startLevel(i) : alert("Уровень скоро появится!");
                }
                grid.appendChild(card);
            }
            if (unlockedLevels > totalLevelsInCode) {
                document.getElementById('coming-soon').style.display = 'block';
            }
        }

        function startLevel(lvl) {
            currentLevel = lvl;
            document.getElementById('menu-overlay').style.display = 'none';
            document.getElementById('game-area').style.display = 'flex';
            document.getElementById('lvl-display').innerText = `УРОВЕНЬ ${lvl}`;
            
            timeLeft = 3.0; errorCount = 0; totalTime = 0; points = 0;
            cutletsProgress = 0; stats = { flies: 0, cutlets: 0 };
            updateLabels();
            
            gameActive = true;
            nextItem();
            gameLoop = setInterval(() => {
                if(!gameActive) return;
                const speed = levelConfig[currentLevel]?.timeSpeed || 1.0;
                timeLeft -= (0.1 * speed);
                totalTime += 0.1;
                document.getElementById('timer').innerText = `⏳ ${Math.max(0, timeLeft).toFixed(1)}с`;
                if(timeLeft <= 0) endGame("timeup");
            }, 100);
        }

        function playSound(id) {
            const audio = document.getElementById(id);
            if (audio) { audio.currentTime = 0; audio.play().catch(() => {}); }
        }

        function nextItem() {
            if(!gameActive) return;
            resetUI();
            const rand = Math.random();
            if(rand < 0.0083) { 
                currentItem = 'ivan'; card.innerText = '😷'; playSound('snd-ivan'); setupBeerMode();
            } else {
                currentItem = Math.random() > 0.5 ? 'cutlet' : 'fly';
                card.innerText = currentItem === 'cutlet' ? '🍔' : '🪰';
            }
            card.style.transition = 'none'; card.style.transform = 'scale(0.5)'; card.style.opacity = '0';
            setTimeout(() => { card.style.transition = 'all 0.2s'; card.style.transform = 'scale(1)'; card.style.opacity = '1'; }, 50);
        }

        function setupBeerMode() {
            beerSide = Math.random() > 0.5 ? 'left' : 'right';
            document.getElementById('special-' + beerSide).style.display = 'block';
            document.getElementById('zone-' + beerSide).style.backgroundColor = '#6d4c41';
        }

        function resetUI() {
            beerSide = null;
            document.querySelectorAll('.special-label').forEach(el => el.style.display = 'none');
            document.getElementById('zone-left').style.backgroundColor = '#ffdde1';
            document.getElementById('zone-right').style.backgroundColor = '#d1e8ff';
        }

        function handleChoice(side) {
            if(!gameActive) return;
            const config = levelConfig[currentLevel];

            if(currentItem === 'ivan') {
                if(side === beerSide) { 
                    points += 5; 
                    tg.HapticFeedback.notificationOccurred('success'); 
                    nextItem();
                } else { endGame("ivan_stole"); return; }
            } else {
                const isCorrect = (side === 'right' && currentItem === 'cutlet') || (side === 'left' && currentItem === 'fly');
                if(isCorrect) {
                    timeLeft += 1.0; playSound('snd-success');
                    if(currentItem === 'cutlet') {
                        stats.cutlets++; cutletsProgress++;
                        if(cutletsProgress >= 10) { points++; cutletsProgress = 0; }
                    } else { stats.flies++; }
                } else {
                    errorCount++; playSound(errorCount % 5 === 0 ? 'snd-error-big' : 'snd-error');
                    if(currentItem === 'fly') points = Math.max(0, points - config.flyPenalty);
                    if(errorCount % 5 === 0 && errorCount < 15) showMsg("ОШИБКА!");
                    if(errorCount >= 15) { endGame("fatal"); return; }
                }
            }
            updateLabels();
            if(points >= config.target) endGame("win");
            else if(currentItem !== 'ivan') nextItem();
        }

        function updateLabels() {
            const config = levelConfig[currentLevel];
            document.getElementById('score-points').innerText = `🏆 ${points.toFixed(1)}/${config.target}`;
            document.getElementById('cutlet-count').innerText = `🥩 ${cutletsProgress}/10`;
            document.getElementById('errors').innerText = `❌ ${errorCount}/15`;
        }

        function endGame(reason) {
            gameActive = false; clearInterval(gameLoop);
            let title = "", msg = "";
            
            if(reason === "win") {
                title = "УРОВЕНЬ ПРОЙДЕН! 🎉";
                playSound('snd-win');
                if (currentLevel === unlockedLevels) {
                    unlockedLevels++;
                    localStorage.setItem('unlockedLevels', unlockedLevels);
                }
            } else {
                title = reason === "ivan_stole" ? "ИВАН УКРАЛ ВСЁ! 😱" : "ИГРА ОКОНЧЕНА";
                playSound('snd-lose');
            }

            document.getElementById('finish-content').innerHTML = `
                <h2 style="color:#ffeb3b">${title}</h2>
                <p>Время: ${totalTime.toFixed(1)} сек | Баллы: ${points.toFixed(1)}</p>
            `;
            document.getElementById('finish-overlay').style.display = 'flex';
        }

        function backToMenu() {
            document.getElementById('finish-overlay').style.display = 'none';
            document.getElementById('game-area').style.display = 'none';
            showMenu();
        }

        function showMsg(text) {
            const el = document.getElementById('error-overlay');
            el.innerText = text; el.style.display = 'flex';
            setTimeout(() => el.style.display = 'none', 800);
        }
    </script>
</body>
</html>
