<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Мухи и Котлеты</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Основные стили страницы */
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; /* Запрещаем скролл страницы */
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Контейнер для игрового поля */
        #game-area {
            flex-grow: 1; /* Занимает все свободное место */
            position: relative;
            display: flex;
            width: 100%;
        }

        /* Фоновые половины */
        .half {
            width: 50%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Надписи сверху */
            padding-top: 20px;
            box-sizing: border-box;
        }

        .left-half {
            background-color: #ffdde1; /* Нежно-розовый */
            border-right: 2px solid rgba(0,0,0,0.1);
        }

        .right-half {
            background-color: #d1e8ff; /* Нежно-голубой */
        }

        /* Стили для надписей "Мухи" и "Котлеты" */
        .label {
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #555;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.5);
        }

        /* Панель с информацией (таймер и ошибки) */
        #info-bar {
            position: absolute;
            top: 70px; /* Чуть ниже надписей половин */
            width: 100%;
            display: flex;
            justify-content: space-around;
            pointer-events: none; /* Чтобы не мешало кликам, если перекроет */
        }

        .info-item {
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        #timer { color: #333; }
        #errors { color: #d9534f; } /* Красный цвет для ошибок */

        /* Стили для карточки с объектом */
        .card-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            perspective: 1000px; /* Для 3D эффектов при анимации */
        }

        .card {
            width: 150px;
            height: 150px;
            background: white;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: transform 0.2s ease-out, opacity 0.2s; /* Анимация при клике */
        }

        /* Панель с кнопками управления */
        #controls {
