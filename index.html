<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>МухиVSКотлеты</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; overflow: hidden; background-color: #000; touch-action: none; height: 100vh; }
        #splash-screen { position: fixed; inset: 0; z-index: 300; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #bg-logo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
        #global-stats { background: rgba(0,0,0,0.4); color: #fff; padding: 10px 20px; border-radius: 15px; margin-bottom: 20px; backdrop-filter: blur(5px); text-align: center; font-size: 14px; font-weight: bold; border: 1px solid rgba(255,255,255,0.1); }
        .btn-ui { padding: 15px 40px; font-size: 18px; color: white; border: none; border-radius: 18px; font-weight: bold; cursor: pointer; background: rgba(0, 136, 204, 0.35); backdrop-filter: blur(8px); margin-bottom: 12px; width: 240px; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .btn-calc { background: rgba(76, 175, 80, 0.35); }
        .calc-window { width: 85%; max-width: 320px; background: white; border-radius: 20px; padding: 20px; text-align: center; color: #333; }
        .calc-input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        #calcOutput { margin-top: 10px; padding: 12px; background: #f8f9fa; border-radius: 10px; font-size: 12px; min-height: 60px; border: 1px dashed #4caf50; display: flex; align-items: center; justify-content: center; }
        #game-area { position: relative; width: 100%; height: 100%; display: none; overflow: hidden; background: #fff; }
        .tap-zone { width: 50%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
        #zone-left { background: #ffdde1; } #zone-right { background: #d1e8ff; }
        .card { width: 130px; height: 130px; background: white; border-radius: 35px; display: flex; align-items: center; justify-content: center; font-size: 70px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); transition: 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28); }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; padding: 30px; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="logo.jpg" id="bg-logo">
        <div id="global-stats">🏆 Баллы: <span id="gs-pts">0</span> | 🍔 Котлеты: <span id="gs-kots">0</span></div>
        <button class="btn-ui" onclick="showMenu()">ИГРАТЬ</button>
        <button class="btn-ui btn-calc" onclick="toggleCalc(true)">🧮 КАЛЬКУЛЯТОР</button>
    </div>

    <div id="calc-overlay" style="position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:400; display:none; align-items:center; justify-content:center;">
        <div class="calc-window">
            <h3 style="margin-top:0">🧮 Расчет пайка</h3>
            <input type="number" id="calcA" class="calc-input" placeholder="Количество человек">
            <input type="number" id="calcB" class="calc-input" placeholder="Количество дней">
            <input type="text" id="calcD" class="calc-input" placeholder="Ваше имя">
            <div id="calcOutput">Введите данные...</div>
            <button class="btn-ui" style="width:100%; margin-top:10px; background:#4caf50; opacity:1" onclick="doCalc()">РАССЧИТАТЬ</button>
            <button class="btn-ui" style="width:100%; background:#9e9e9e; opacity:1" onclick="resetCalc()">СБРОС</button>
            <button onclick="toggleCalc(false)" style="margin-top:10px; border:none; background:none; color:#999">Закрыть</button>
        </div>
    </div>

    <div id="game-area">
        <div id="info-bar" style="position:absolute; top:50px; width:100%; display:flex; justify-content:center; gap:8px; z-index:50;">
            <div id="timer-ui" style="background:#fff; padding:5px 12px; border-radius:12px; font-weight:bold;">⏳ 3.0с</div>
            <div id="score-ui" style="background:#fff; padding:5px 12px; border-radius:12px; font-weight:bold;">🏆 0</div>
            <div id="err-ui" style="background:#fff; padding:5px 12px; border-radius:12px; font-weight:bold;">❌ 0/5</div>
        </div>
        <div id="standard-mode" style="display:flex; height:100%; width:100%">
            <div class="tap-zone" id="zone-left" onclick="handleInput('left')"><span style="opacity:0.15; font-size:26px; font-weight:bold">МУХИ</span></div>
            <div class="tap-zone" id="zone-right" onclick="handleInput('right')"><span style="opacity:0.15; font-size:26px; font-weight:bold">КОТЛЕТЫ</span></div>
            <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none;"><div id="card" class="card">🍔</div></div>
        </div>
    </div>

    <div id="finish-overlay" class="overlay">
        <div id="finish-content"></div>
        <button class="btn-ui" style="opacity:1" onclick="showMenu()">ПРОДОЛЖИТЬ</button>
    </div>

    <audio id="snd-success" src="success.mp3"></audio>
    <audio id="snd-error" src="error.mp3"></audio>
    <audio id="snd-error-big" src="error1.mp3"></audio>
    <audio id="snd-ivan" src="ivan.mp3"></audio>
    <audio id="snd-win" src="win.mp3"></audio>
    <audio id="snd-lose" src="lose.mp3"></audio>

    <script>
        const tg = window.Telegram.WebApp;
        let unlocked = parseInt(localStorage.getItem('unlocked_v6')) || 1;
        let globalPts = parseFloat(localStorage.getItem('global_pts')) || 0;
        let globalKots = parseInt(localStorage.getItem('global_kots')) || 0;

        let curLvl = 1, points = 0, timeLeft = 3, errors = 0, gameActive = false, gameStarted = false;
        let lvlKots = 0, loop, ivanPubSide = '';

        function haptic(t) { try { if(t==='l') tg.HapticFeedback.impactOccurred('light'); if(t==='e') tg.HapticFeedback.notificationOccurred('error'); if(t==='s') tg.HapticFeedback.notificationOccurred('success'); } catch(e){} }
        function play(id) { const s = document.getElementById(id); if(s){s.currentTime=0; s.play().catch(()=>{});} }

        function plural(n, forms) {
            let res = (n % 10 == 1 && n % 100 != 11 ? forms[0] : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? forms[1] : forms[2]));
            return n + ' ' + res;
        }

        function doCalc() {
            let a = parseInt(document.getElementById('calcA').value), b = parseInt(document.getElementById('calcB').value), n = document.getElementById('calcD').value;
            let out = document.getElementById('calcOutput');
            if(!a || !b || !n) { out.innerText = "Заполни поля!"; return; }
            if(n.toLowerCase().startsWith('гал')) { out.innerText = `Ты в отпуске перегрелась, ${n}, мухи отдельно, котлеты отдельно!`; return; }
            let mCount = Math.floor(85/0.014 * 18 * b * a);
            let kCount = Math.floor(mCount / 6071);
            
            let sM = plural(mCount, ['муха', 'мухи', 'мух']);
            let sP = plural(a, ['человека', 'человек', 'человек']);
            let sD = plural(b, ['день', 'дня', 'дней']);
            let sK = plural(kCount, ['котлета', 'котлеты', 'котлет']);

            out.innerText = `Потребуется ${sM}, чтобы накормить ${sP} на ${sD}. И кстати, ${n}, это будет ${sK}.`;
        }

        function showMenu() {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('finish-overlay').style.display = 'none';
            document.getElementById('game-area').style.display = 'none';
            // Логика отрисовки кнопок уровней... (пропущено для краткости, аналогично прошлому коду)
            location.reload(); // Для простоты сброса при возврате
        }

        function startLvl(lvl) {
            curLvl = lvl; points = 0; timeLeft = 3; errors = 0; lvlKots = 0; gameActive = true; gameStarted = false;
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            nextItem();
        }

        function nextItem() {
            const c = document.getElementById('card');
            let flyChance = curLvl === 2 ? 0.21 : 0.08; // Частота мух во 2 уровне выше на ~13%
            if(Math.random() < flyChance) {
                // Шанс Ивана или Мухи
                if(Math.random() < 0.2) { curEmoji = 'ivan'; c.innerText = '😷'; play('snd-ivan'); }
                else { curEmoji = 'fly'; c.innerText = '🪰'; }
            } else { curEmoji = 'cutlet'; c.innerText = '🍔'; }
        }

        function handleInput(side) {
            if(!gameActive) return;
            if(!gameStarted) {
                gameStarted = true;
                const dec = curLvl === 2 ? 1.4 : 1.0;
                loop = setInterval(() => {
                    timeLeft -= (0.1 * dec);
                    document.getElementById('timer-ui').innerText = `⏳ ${Math.max(0, timeLeft).toFixed(1)}с`;
                    if(timeLeft <= 0) endGame('time');
                }, 100);
            }

            const correct = (side === 'right' && curEmoji === 'cutlet') || (side === 'left' && curEmoji === 'fly');
            if(correct) {
                timeLeft += (curLvl === 2 ? 0.8 : 1.0);
                if(curEmoji === 'cutlet') { points += 1; lvlKots++; }
                play('snd-success'); haptic('l');
            } else {
                errors++;
                if(curEmoji === 'fly') points -= 0.5;
                if(errors >= 5 && points < 0) { endGame('fatal'); return; }
                play('snd-error'); haptic('e');
            }

            document.getElementById('score-ui').innerText = `🏆 ${points}`;
            document.getElementById('err-ui').innerText = `❌ ${errors}/5`;
            
            let target = curLvl === 1 ? 20 : 15;
            if(points >= target) endGame('win'); else nextItem();
        }

        function endGame(r) {
            gameActive = false; clearInterval(loop);
            let win = r === 'win';
            if(win) {
                globalPts += points; globalKots += lvlKots;
                localStorage.setItem('global_pts', globalPts);
                localStorage.setItem('global_kots', globalKots);
                play('snd-win'); haptic('s');
            } else { play('snd-lose'); haptic('e'); }
            document.getElementById('finish-overlay').style.display = 'flex';
            document.getElementById('finish-content').innerHTML = `<h1>${win?'ПОБЕДА!':'КОНЕЦ'}</h1><p>Счёт: ${points}</p>`;
        }

        function toggleCalc(s) { document.getElementById('calc-overlay').style.display = s ? 'flex' : 'none'; }
        function resetCalc() { document.getElementById('calcA').value=''; document.getElementById('calcB').value=''; document.getElementById('calcD').value=''; document.getElementById('calcOutput').innerText='Очищено'; }
    </script>
</body>
</html>
