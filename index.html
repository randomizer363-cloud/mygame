<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>МухиVSКотлеты</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; overflow: hidden; background-color: #f0f0f0; touch-action: none; height: 100vh; }
        
        /* ЗАСТАВКА (Без текста) */
        #splash-screen { position: fixed; inset: 0; background: linear-gradient(135deg, #ffdde1, #d1e8ff); z-index: 300; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #main-logo { width: 220px; border-radius: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); margin-bottom: 30px; }

        /* КНОПКИ */
        .btn-start { padding: 15px 40px; font-size: 20px; background: #0088cc; color: white; border: none; border-radius: 15px; font-weight: bold; cursor: pointer; }
        .btn-calc-open { padding: 10px 20px; background: #4caf50; color: white; border: none; border-radius: 10px; margin-top: 15px; }

        /* МЕНЮ (Кнопки -15%) */
        #menu-overlay { position: fixed; inset: 0; background: white; z-index: 200; display: none; flex-direction: column; align-items: center; padding-top: 20px; }
        .levels-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 15px; width: 80%; }
        .level-card { height: 68px; background: #e0e0e0; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #999; }
        .level-card.open { background: #0088cc; color: white; }

        /* ГЕЙМПЛЕЙ */
        #game-area { position: relative; width: 100%; height: 100%; display: none; overflow: hidden; }
        .tap-zone { width: 50%; height: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 30px; }
        #zone-left { background: #ffdde1; } #zone-right { background: #d1e8ff; }
        .card-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        .card { width: 130px; height: 130px; background: white; border-radius: 30px; display: flex; align-items: center; justify-content: center; font-size: 60px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); transition: 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28); }
        .fly-left { transform: translate(-300%, -20%) rotate(-30deg); opacity: 0; }
        .fly-right { transform: translate(200%, -20%) rotate(30deg); opacity: 0; }

        /* РАННЕР (УРОВЕНЬ 3) */
        #runner-area { position: absolute; inset: 0; display: none; background: #eee; }
        .lane { width: 33.33%; height: 100%; border-right: 1px dashed #ccc; float: left; position: relative; }
        #player-fly { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); font-size: 50px; transition: left 0.2s; z-index: 10; }
        .falling-item { position: absolute; top: -60px; left: 50%; transform: translateX(-50%); font-size: 40px; }

        #info-bar { position: absolute; top: 70px; width: 100%; display: flex; justify-content: center; gap: 5px; z-index: 20; pointer-events: none; }
        .info-item { background: white; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }

        /* ОВЕРЛЕИ */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 500; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; padding: 20px; }
        #calc-overlay { background: rgba(255,255,255,0.95); color: #333; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="logo.jpg" id="main-logo" alt="Logo">
        <button class="btn-start" onclick="showMenu()">ИГРАТЬ</button>
        <button class="btn-calc-open" onclick="toggleCalc(true)">🧮 Калькулятор</button>
    </div>

    <div id="menu-overlay">
        <h2>УРОВНИ</h2>
        <div class="levels-grid" id="levels-grid"></div>
        <button class="btn-calc-open" style="background:#777" onclick="location.reload()">В начало</button>
    </div>

    <div id="game-area">
        <div id="info-bar">
            <div id="timer" class="info-item">⏳ 3.0с</div>
            <div id="score" class="info-item">🏆 0.0/10</div>
            <div id="err-display" class="info-item">❌ 0/15</div>
        </div>
        <div id="standard-game" style="display:flex; height:100%; width:100%">
            <div class="tap-zone" id="zone-left" onclick="handleChoice('left')">МУХИ</div>
            <div class="tap-zone" id="zone-right" onclick="handleChoice('right')">КОТЛЕТЫ</div>
            <div class="card-container"><div id="card" class="card">🍔</div></div>
        </div>
        <div id="runner-area">
            <div class="lane"></div><div class="lane"></div><div class="lane"></div>
            <div id="player-fly">🪰</div>
        </div>
    </div>

    <div id="finish-overlay" class="overlay">
        <div id="finish-content"></div>
        <button class="btn-start" onclick="showMenu()" style="margin-top:20px">К уровням</button>
    </div>

    <audio id="snd-success" src="success.mp3"></audio>
    <audio id="snd-error" src="error.mp3"></audio>
    <audio id="snd-win" src="win.mp3"></audio>
    <audio id="snd-lose" src="lose.mp3"></audio>

    <script>
        const tg = window.Telegram.WebApp;
        let unlocked = parseInt(localStorage.getItem('unlocked')) || 1;
        let curLvl = 1, points = 0, timeLeft = 3, errors = 0, gameActive = false;
        let cutletsSorted = 0, fliesSorted = 0, totalT = 0, loop;
        let playerLane = 1; // Для раннера (0, 1, 2)

        function triggerHaptic(style) { try { tg.HapticFeedback.impactOccurred(style); } catch(e){} }
        function playSnd(id) { const s = document.getElementById(id); s.currentTime=0; s.play().catch(()=>{}); }

        function showMenu() {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('finish-overlay').style.display = 'none';
            document.getElementById('game-area').style.display = 'none';
            document.getElementById('menu-overlay').style.display = 'flex';
            const grid = document.getElementById('levels-grid'); grid.innerHTML = '';
            for(let i=1; i<=4; i++) {
                let div = document.createElement('div');
                div.className = `level-card ${i<=unlocked ? 'open' : ''}`;
                div.innerText = i + (i>unlocked ? ' 🔒' : '');
                if(i<=unlocked) div.onclick = () => startLvl(i);
                grid.appendChild(div);
            }
        }

        function startLvl(lvl) {
            curLvl = lvl; points = 0; timeLeft = 3; errors = 0; totalT = 0;
            cutletsSorted = 0; fliesSorted = 0;
            document.getElementById('menu-overlay').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            gameActive = true;
            
            if(lvl === 3) {
                initRunner();
            } else {
                document.getElementById('standard-game').style.display = 'flex';
                document.getElementById('runner-area').style.display = 'none';
                nextItem();
                const speed = lvl === 2 ? 0.8 : 1.0; // На 2 уровне таймер идет на 20% медленнее
                loop = setInterval(() => {
                    timeLeft -= (0.1 * speed); totalT += 0.1;
                    document.getElementById('timer').innerText = `⏳ ${Math.max(0, timeLeft).toFixed(1)}с`;
                    if(timeLeft <= 0) endGame('time');
                }, 100);
            }
        }

        // --- ЛОГИКА УРОВНЕЙ 1-2 ---
        let curItem = '';
        function nextItem() {
            const c = document.getElementById('card');
            c.className = 'card'; 
            if(Math.random() < 0.05) { curItem = 'ivan'; c.innerText = '😷'; }
            else { curItem = Math.random() > 0.5 ? 'cutlet' : 'fly'; c.innerText = curItem === 'cutlet' ? '🍔' : '🪰'; }
        }

        function handleChoice(side) {
            if(!gameActive) return;
            const correct = (side === 'right' && curItem === 'cutlet') || (side === 'left' && curItem === 'fly');
            const card = document.getElementById('card');
            card.classList.add(side === 'left' ? 'fly-left' : 'fly-right');

            if(curItem === 'ivan') {
                if(side === 'right') { // Пытался спасти котлеты от Ивана
                    alert("Иван успел купить пиво - котлеты в безопасности");
                    points += 5; triggerHaptic('medium');
                } else {
                    alert("Иван не успел купить пиво и украл все котлеты");
                    endGame('ivan'); return;
                }
            } else if(correct) {
                points += 1; timeLeft += 0.8; triggerHaptic('light');
                if(curItem === 'cutlet') cutletsSorted++; else fliesSorted++;
            } else {
                errors++; triggerHaptic('error'); playSnd('snd-error');
                if(errors >= 15) { endGame('errors'); return; }
            }
            
            document.getElementById('score').innerText = `🏆 ${points}/10`;
            document.getElementById('err-display').innerText = `❌ ${errors}/15`;
            if(points >= 10) endGame('win'); else setTimeout(nextItem, 200);
        }

        // --- РАННЕР (УРОВЕНЬ 3) ---
        let runnerInterval;
        function initRunner() {
            document.getElementById('standard-game').style.display = 'none';
            document.getElementById('runner-area').style.display = 'block';
            playerLane = 1; updateFlyPos();
            runnerInterval = setInterval(spawnRunnerItem, 1000);
            loop = setInterval(() => { totalT += 0.1; }, 100);
        }
        function updateFlyPos() { document.getElementById('player-fly').style.left = (16.5 + playerLane * 33.33) + '%'; }
        
        function spawnRunnerItem() {
            if(!gameActive) return;
            const isCutlet = Math.random() > 0.3;
            const laneIdx = Math.floor(Math.random()*3);
            const el = document.createElement('div');
            el.className = 'falling-item';
            el.innerText = isCutlet ? '🍔' : '🧹';
            document.querySelectorAll('.lane')[laneIdx].appendChild(el);
            
            let pos = -60;
            let fall = setInterval(() => {
                pos += 5; el.style.top = pos + 'px';
                if(pos > window.innerHeight - 120 && laneIdx === playerLane) {
                    clearInterval(fall); el.remove();
                    if(isCutlet) { points++; cutletsSorted++; triggerHaptic('light'); }
                    else { endGame('hit'); }
                    document.getElementById('score').innerText = `🏆 ${points}/15`;
                    if(points >= 15) endGame('win');
                }
                if(pos > window.innerHeight) { clearInterval(fall); el.remove(); }
            }, 20);
        }

        function endGame(reason) {
            gameActive = false; clearInterval(loop); clearInterval(runnerInterval);
            const win = reason === 'win';
            if(win) { 
                if(curLvl === unlocked) unlocked++; 
                localStorage.setItem('unlocked', unlocked);
                playSnd('snd-win');
            } else playSnd('snd-lose');

            document.getElementById('finish-content').innerHTML = `
                <h2>${win ? 'ПОБЕДА!' : 'ПРОИГРЫШ'}</h2>
                <p>Время: ${totalT.toFixed(1)}с</p>
                <p>Баллы: ${points}</p>
                <p style="color:#4caf50">Вы заработали ${cutletsSorted} котлет</p>
                <p style="color:#f44336">Вы отогнали ${fliesSorted} мух</p>
            `;
            document.getElementById('finish-overlay').style.display = 'flex';
        }

        // Управление
        document.addEventListener('keydown', e => {
            if(curLvl === 3) {
                if(e.key === 'ArrowLeft') { playerLane = Math.max(0, playerLane-1); updateFlyPos(); }
                if(e.key === 'ArrowRight') { playerLane = Math.min(2, playerLane+1); updateFlyPos(); }
            } else {
                if(e.key === 'ArrowLeft') handleChoice('left');
                if(e.key === 'ArrowRight') handleChoice('right');
            }
        });

        let startX = 0;
        document.addEventListener('touchstart', e => startX = e.touches[0].clientX);
        document.addEventListener('touchend', e => {
            let diff = e.changedTouches[0].clientX - startX;
            if(Math.abs(diff) < 30) return;
            if(curLvl === 3) {
                if(diff < 0) playerLane = Math.max(0, playerLane-1);
                else playerLane = Math.min(2, playerLane+1);
                updateFlyPos();
            } else {
                handleChoice(diff < 0 ? 'left' : 'right');
            }
        });

        function toggleCalc(s) { alert("Калькулятор скоро будет интегрирован!"); }
    </script>
</body>
</html>
