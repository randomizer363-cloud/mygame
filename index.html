<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>МухиVSКотлеты</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; overflow: hidden; background-color: #000; touch-action: none; height: 100vh; }
        
        #splash-screen { position: fixed; inset: 0; z-index: 300; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* Статистика поднята наверх */
        #global-stats { position: absolute; top: 20px; background: rgba(0,0,0,0.4); color: #fff; padding: 10px 20px; border-radius: 15px; backdrop-filter: blur(5px); text-align: center; font-size: 14px; font-weight: bold; border: 1px solid rgba(255,255,255,0.1); z-index: 310; }

        /* Логотип уменьшен на 2% */
        #bg-logo { position: absolute; inset: 0; width: 98%; height: 98%; left: 1%; top: 1%; object-fit: cover; z-index: -1; }
        
        .btn-ui { padding: 15px 40px; font-size: 18px; color: white; border: none; border-radius: 18px; font-weight: bold; cursor: pointer; background: rgba(0, 136, 204, 0.35); backdrop-filter: blur(8px); margin-bottom: 12px; width: 240px; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .btn-play { background: rgba(0, 136, 204, 0.17); }
        .btn-calc { background: rgba(76, 175, 80, 0.35); }

        #sound-toggle { position: fixed; bottom: 20px; right: 20px; z-index: 500; background: rgba(255,255,255,0.2); border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 24px; color: white; cursor: pointer; backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; }

        #calc-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 400; display: none; align-items: center; justify-content: center; }
        .calc-window { width: 85%; max-width: 320px; background: white; border-radius: 20px; padding: 20px; text-align: center; color: #333; }
        .calc-input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; outline: none; }
        #calcOutput { margin-top: 10px; padding: 12px; background: #f8f9fa; border-radius: 10px; font-size: 12px; min-height: 60px; border: 1px dashed #4caf50; display: flex; align-items: center; justify-content: center; line-height: 1.4; }

        #menu-overlay { position: fixed; inset: 0; background: #fff; z-index: 200; display: none; flex-direction: column; align-items: center; padding-top: 20px; }
        .levels-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 20px; width: 85%; }
        .level-card { height: 65px; background: #eee; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; color: #aaa; transition: 0.2s; }
        .level-card.open { background: #0088cc; color: white; }

        #game-area { position: relative; width: 100%; height: 100%; display: none; overflow: hidden; background: #fff; }
        .tap-zone { width: 50%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
        #zone-left { background: #ffdde1; } #zone-right { background: #d1e8ff; }
        .zone-label { font-weight: bold; opacity: 0.15; font-size: 26px; pointer-events: none; }
        .pub-label { color: #ffeb3b; font-weight: 900; font-size: 22px; display: none; text-shadow: 1px 1px 2px #000; position: absolute; pointer-events: none; }

        .card-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; pointer-events: none; }
        .card { width: 130px; height: 130px; background: white; border-radius: 35px; display: flex; align-items: center; justify-content: center; font-size: 70px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); transition: 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28); }
        .fly-left { transform: translate(-300%, -50%) rotate(-30deg); opacity: 0; }
        .fly-right { transform: translate(200%, -50%) rotate(30deg); opacity: 0; }

        #runner-mode { position: absolute; inset: 0; display: none; background: #fff; }
        #player-fly { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 60px; transition: left 0.15s; z-index: 15; }
        .lane { width: 33.33%; height: 100%; float: left; position: relative; }
        .falling-item { position: absolute; top: -100px; left: 50%; transform: translateX(-50%); font-size: 50px; }

        #info-bar { position: absolute; top: 50px; width: 100%; display: flex; justify-content: center; gap: 8px; z-index: 50; }
        .info-item { background: rgba(255,255,255,0.9); padding: 5px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; border: 1px solid #eee; min-width: 60px; text-align: center; }
        
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; padding: 30px; }
    </style>
</head>
<body>

    <button id="sound-toggle" onclick="toggleMute()">🔊</button>

    <div id="splash-screen">
        <div id="global-stats">🏆 Баллы: <span id="gs-pts">0</span> | 🍔 Котлеты: <span id="gs-kots">0</span></div>
        <img src="logo.jpg" id="bg-logo">
        <button class="btn-ui btn-play" onclick="showMenu()">ИГРАТЬ</button>
        <button class="btn-ui btn-calc" onclick="toggleCalc(true)">🧮 КАЛЬКУЛЯТОР</button>
    </div>

    <div id="calc-overlay">
        <div class="calc-window">
            <h3 style="margin-top:0; color:#4caf50">🧮 Калькулятор</h3>
            <input type="number" id="calcA" class="calc-input" placeholder="Количество человек">
            <input type="number" id="calcB" class="calc-input" placeholder="Количество дней">
            <input type="text" id="calcD" class="calc-input" placeholder="Ваше имя">
            <div id="calcOutput">Введите данные...</div>
            <button class="btn-ui" style="width:100%; margin-top:10px; background:#4caf50; opacity:1;" onclick="doCalc()">РАССЧИТАТЬ</button>
            <button class="btn-ui" style="width:100%; background:#9e9e9e; opacity:1;" onclick="resetCalc()">СБРОС</button>
            <button onclick="toggleCalc(false)" style="margin-top:10px; border:none; background:none; color:#999">Закрыть</button>
        </div>
    </div>

    <div id="menu-overlay">
        <h2 style="color:#0088cc">УРОВНИ</h2>
        <div class="levels-grid" id="levels-grid"></div>
        <button onclick="hideMenu()" style="background:none; border:none; color:#999; margin-top:20px; font-weight:bold">Назад</button>
    </div>

    <div id="game-area">
        <div id="info-bar">
            <div id="timer-ui" class="info-item">⏳ 3.0с</div>
            <div id="score-ui" class="info-item">🏆 0</div>
            <div id="err-ui" class="info-item">❌ 0/5</div>
        </div>
        <div id="standard-mode" style="display:flex; height:100%; width:100%">
            <div class="tap-zone" id="zone-left" onclick="handleInput('left')">
                <div class="zone-label" id="label-left">МУХИ</div>
                <div class="pub-label" id="pub-left">🍺 ПИВНУШКА</div>
            </div>
            <div class="tap-zone" id="zone-right" onclick="handleInput('right')">
                <div class="zone-label" id="label-right">КОТЛЕТЫ</div>
                <div class="pub-label" id="pub-right">🍺 ПИВНУШКА</div>
            </div>
            <div class="card-container"><div id="card" class="card">🍔</div></div>
        </div>
        <div id="runner-mode">
            <div class="lane"></div><div class="lane"></div><div class="lane"></div>
            <div id="player-fly">🪰</div>
        </div>
    </div>

    <div id="finish-overlay" class="overlay">
        <div id="finish-content"></div>
        <button class="btn-ui" style="opacity:1" onclick="showMenu()">МЕНЮ</button>
    </div>

    <audio id="snd-bg" src="Astronomia.mp3" loop></audio>
    <audio id="snd-success" src="success.mp3"></audio>
    <audio id="snd-error" src="error.mp3"></audio>
    <audio id="snd-error-big" src="error1.mp3"></audio>
    <audio id="snd-ivan" src="ivan.mp3"></audio>
    <audio id="snd-win" src="win.mp3"></audio>
    <audio id="snd-lose" src="lose.mp3"></audio>

    <script>
        const tg = window.Telegram.WebApp;
        let unlocked = parseInt(localStorage.getItem('unlocked_v6')) || 1;
        let globalPts = parseFloat(localStorage.getItem('global_pts')) || 0;
        let globalKots = parseInt(localStorage.getItem('global_kots')) || 0;
        let isMuted = false;

        let curLvl = 1, points = 0, timeLeft = 3, errors = 0, gameActive = false, gameStarted = false;
        let lvlKots = 0, loop, ivanPubSide = '', runnerInt, curEmoji = '';

        // Громкость Astronomia на 50%
        document.getElementById('snd-bg').volume = 0.5;

        function toggleMute() {
            isMuted = !isMuted;
            const bg = document.getElementById('snd-bg');
            if (isMuted) {
                bg.pause();
                document.getElementById('sound-toggle').innerText = '🔇';
            } else {
                // Играем только если мы в меню
                if (document.getElementById('menu-overlay').style.display === 'flex' || document.getElementById('splash-screen').style.display === 'flex') {
                    bg.play().catch(()=>{});
                }
                document.getElementById('sound-toggle').innerText = '🔊';
            }
        }

        function haptic(t) { 
            try { 
                if(t==='m') tg.HapticFeedback.impactOccurred('medium'); 
                if(t==='e') tg.HapticFeedback.notificationOccurred('error'); 
                if(t==='h') tg.HapticFeedback.impactOccurred('heavy'); 
                if(t==='s') tg.HapticFeedback.notificationOccurred('success'); 
            } catch(e){} 
        }

        function play(id) { 
            if (isMuted) return;
            const s = document.getElementById(id); 
            if(s){s.currentTime=0; s.play().catch(()=>{});} 
        }

        function updateGlobalUI() {
            document.getElementById('gs-pts').innerText = globalPts.toFixed(2);
            document.getElementById('gs-kots').innerText = globalKots;
        }
        updateGlobalUI();

        function plural(n, forms) {
            let n1 = Math.abs(n) % 100; let n2 = n1 % 10;
            if (n1 > 10 && n1 < 20) return n + ' ' + forms[2];
            if (n2 > 1 && n2 < 5) return n + ' ' + forms[1];
            if (n2 == 1) return n + ' ' + forms[0];
            return n + ' ' + forms[2];
        }

        function doCalc() {
            let a = parseInt(document.getElementById('calcA').value), b = parseInt(document.getElementById('calcB').value), n = document.getElementById('calcD').value;
            let out = document.getElementById('calcOutput');
            if(!a || !b || !n) { out.innerText = "Заполни все поля!"; return; }
            let nl = n.toLowerCase();
            if(nl.startsWith('гал')) { out.innerText = `Ты в отпуске перегрелась, ${n}, мухи отдельно, котлеты отдельно!`; return; }
            if(nl.includes('никит')) { out.innerText = `На хуй пошёл, ${n}, говна поешь!`; return; }
            
            let mTotal = Math.floor(85/0.014 * 18 * b * a);
            let kTotal = Math.floor(mTotal / 6071);
            out.innerText = `Потребуется ${plural(mTotal,['муха','мухи','мух'])}, чтобы накормить ${plural(a,['человека','человек','человек'])} на ${plural(b,['день','дня','дней'])}. И кстати, ${n}, это будет ${plural(kTotal,['котлета','котлеты','котлет'])}.`;
        }
        function resetCalc() { document.getElementById('calcA').value=''; document.getElementById('calcB').value=''; document.getElementById('calcD').value=''; document.getElementById('calcOutput').innerText='Очищено'; }
        
        function toggleCalc(s) { 
            document.getElementById('calc-overlay').style.display = s ? 'flex' : 'none'; 
            // Останавливаем/запускаем музыку при открытии калькулятора
            const bg = document.getElementById('snd-bg');
            if (s) bg.pause(); else if (!isMuted) bg.play().catch(()=>{});
        }

        function showMenu() {
            if (!isMuted) document.getElementById('snd-bg').play().catch(()=>{});
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('finish-overlay').style.display = 'none';
            document.getElementById('game-area').style.display = 'none';
            document.getElementById('menu-overlay').style.display = 'flex';
            const grid = document.getElementById('levels-grid'); grid.innerHTML = '';
            for(let i=1; i<=10; i++) {
                let c = document.createElement('div');
                c.className = `level-card ${i<=unlocked ? 'open' : ''}`;
                c.innerText = i + (i>unlocked ? ' 🔒' : '');
                c.onclick = () => { if(i<=unlocked) { 
                    if(i===1) alert("Задача: Отсортируй 50 котлет!");
                    if(i===2) alert("Задача: Отсортируй 30 котлет (Скорость выше!)");
                    if(i===3) alert("Задача: Собери 100 котлет, избегая мусора!");
                    if(i<=3) startLvl(i); else alert("Скоро выйдет!"); 
                } };
                grid.appendChild(c);
            }
        }
        function hideMenu() { document.getElementById('menu-overlay').style.display = 'none'; document.getElementById('splash-screen').style.display = 'flex'; }

        function startLvl(lvl) {
            document.getElementById('snd-bg').pause(); // Выключаем музыку в игре
            curLvl = lvl; points = 0; timeLeft = 3; errors = 0; lvlKots = 0; gameActive = true; gameStarted = false;
            document.getElementById('menu-overlay').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            document.getElementById('timer-ui').innerText = `⏳ 3.0с`;
            document.getElementById('score-ui').innerText = `🏆 0`;
            document.getElementById('err-ui').innerText = `❌ 0/5`;
            if(lvl === 3) initRunner(); else {
                document.getElementById('standard-mode').style.display = 'flex';
                document.getElementById('runner-mode').style.display = 'none';
                nextItem();
            }
        }

        function nextItem() {
            const c = document.getElementById('card'); c.className = 'card';
            resetZones();
            let flyChance = curLvl === 1 ? 0.38 : (curLvl === 2 ? 0.21 : 0.08); 
            
            if(Math.random() < flyChance) {
                if(Math.random() < 0.2) { 
                    curEmoji = 'ivan'; c.innerText = '😷'; play('snd-ivan');
                    ivanPubSide = Math.random() > 0.5 ? 'left' : 'right';
                    document.getElementById('label-'+ivanPubSide).style.display = 'none';
                    document.getElementById('pub-'+ivanPubSide).style.display = 'block';
                    document.getElementById('zone-'+ivanPubSide).style.background = '#6d4c41';
                } else { curEmoji = 'fly'; c.innerText = '🪰'; }
            } else { curEmoji = 'cutlet'; c.innerText = '🍔'; }
        }

        function resetZones() {
            document.getElementById('zone-left').style.background = '#ffdde1';
            document.getElementById('zone-right').style.background = '#d1e8ff';
            document.getElementById('label-left').style.display = 'block';
            document.getElementById('label-right').style.display = 'block';
            document.getElementById('pub-left').style.display = 'none';
            document.getElementById('pub-right').style.display = 'none';
        }

        function handleInput(side) {
            if(!gameActive) return;
            if(!gameStarted && curLvl !== 3) {
                gameStarted = true;
                const decSpeed = curLvl === 2 ? 1.4 : 1.0; 
                loop = setInterval(() => {
                    timeLeft -= (0.1 * decSpeed);
                    document.getElementById('timer-ui').innerText = `⏳ ${Math.max(0, timeLeft).toFixed(1)}с`;
                    if(timeLeft <= 0) {
                        if(curEmoji === 'ivan') {
                            alert("Иван не успел купить пиво и украл все котлеты");
                            endGame('ivan');
                        } else { endGame('time'); }
                    }
                }, 100);
            }
            
            if(curLvl === 3) {
                if(side === 'left') pLane = Math.max(0, pLane-1); else pLane = Math.min(2, pLane+1);
                updateFly(); haptic('m');
            } else {
                const correct = (side === 'right' && curEmoji === 'cutlet') || (side === 'left' && curEmoji === 'fly');
                document.getElementById('card').classList.add(side==='left'?'fly-left':'fly-right');
                
                if(curEmoji === 'ivan') {
                    if(side === ivanPubSide) { 
                        alert("Иван успел купить пиво - котлеты в безопасности");
                        points += 5; haptic('s'); play('snd-success'); 
                    } else { 
                        alert("Иван не успел купить пиво и украл все котлеты");
                        endGame('ivan'); return; 
                    }
                } else if(correct) {
                    timeLeft += (curLvl === 2 ? 0.8 : 1.0);
                    if(curEmoji === 'cutlet') { points += 1; lvlKots++; }
                    haptic('m'); play('snd-success');
                } else {
                    errors++;
                    points -= (curEmoji === 'fly' ? 0.5 : 0.25);
                    haptic('h'); 
                    if(errors % 5 === 0) {
                        alert("ОШИБКА!");
                        play('snd-error-big');
                        if(points < 0) { endGame('fatal'); return; }
                    } else { play('snd-error'); }
                }
                document.getElementById('score-ui').innerText = `🏆 ${points.toFixed(2)}`;
                document.getElementById('err-ui').innerText = `❌ ${errors}/5`;
                
                let target = curLvl === 1 ? 50 : (curLvl === 2 ? 30 : 15);
                if(lvlKots >= target) endGame('win'); else setTimeout(nextItem, 200);
            }
        }

        let pLane = 1, rSpeed = 5;
        function initRunner() {
            document.getElementById('standard-mode').style.display = 'none';
            document.getElementById('runner-mode').style.display = 'block';
            pLane = 1; rSpeed = 5; updateFly(); gameStarted = true;
            loop = setInterval(() => { rSpeed += 0.005; }, 100);
            runnerInt = setInterval(spawn, 900);
        }
        function updateFly() { document.getElementById('player-fly').style.left = (16.6 + pLane * 33.3) + '%'; }
        function spawn() {
            if(!gameActive) return;
            let lIdx = Math.floor(Math.random()*3), isE = Math.random() > 0.65;
            let item = document.createElement('div');
            item.className = 'falling-item'; item.innerText = isE ? '🧹' : '🍔';
            document.querySelectorAll('.lane')[lIdx].appendChild(item);
            let y = -100;
            let m = setInterval(() => {
                if(!gameActive){ item.remove(); clearInterval(m); return; }
                y += rSpeed; item.style.top = y + 'px';
                if(y > window.innerHeight/2-40 && y < window.innerHeight/2+40 && lIdx === pLane) {
                    clearInterval(m); item.remove();
                    if(isE) endGame('hit'); else { points++; lvlKots++; haptic('m'); play('snd-success'); }
                    document.getElementById('score-ui').innerText = `🏆 ${points}`;
                    if(lvlKots >= 100 && curLvl === 3) endGame('win');
                }
                if(y > window.innerHeight) { clearInterval(m); item.remove(); }
            }, 20);
        }

        function endGame(r) {
            gameActive = false; gameStarted = false;
            clearInterval(loop); if(runnerInt) clearInterval(runnerInt);
            let win = r === 'win';
            if(win) {
                if(curLvl === unlocked) unlocked++;
                localStorage.setItem('unlocked_v6', unlocked);
                globalPts += points; globalKots += lvlKots;
                localStorage.setItem('global_pts', globalPts);
                localStorage.setItem('global_kots', globalKots);
                updateGlobalUI(); play('snd-win'); haptic('s');
            } else { play('snd-lose'); haptic('e'); }
            
            let msg = win ? "ПОБЕДА!" : "ПРОИГРЫШ";
            if(win && curLvl === 3) msg = "ВЫ СДЕЛАЛИ ИЗ МУХИ СЛОНА!";
            if(r === 'fatal') msg = "ФАТАЛЬНАЯ ОШИБКА!";
            if(r === 'ivan') msg = "ИВАН УКРАЛ КОТЛЕТЫ!";
            
            document.getElementById('finish-content').innerHTML = `<h1>${msg}</h1><p>Котлет собрано: ${lvlKots}</p><p>Баллов: ${points.toFixed(2)}</p>`;
            document.getElementById('finish-overlay').style.display = 'flex';
            // Музыку здесь не включаем, чтобы не перебивать звуки финала. Она включится при нажатии кнопки "МЕНЮ".
        }

        document.addEventListener('keydown', e => { if(e.key === 'ArrowLeft') handleInput('left'); if(e.key === 'ArrowRight') handleInput('right'); });
        document.addEventListener('touchstart', e => this.tx = e.touches[0].clientX);
        document.addEventListener('touchend', e => {
            let d = e.changedTouches[0].clientX - this.tx;
            if(Math.abs(d) > 40) handleInput(d < 0 ? 'left' : 'right');
        });
    </script>
</body>
</html>
