<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>МухиVSКотлеты: Наследие</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; overflow: hidden; background-color: #000; color: white; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; transition: 0.5s; }
        
        .side-kots { background: linear-gradient(135deg, #4b1111 0%, #1a0a0a 100%); }
        .side-fly { background: linear-gradient(135deg, #112d4b 0%, #0a111a 100%); }
        
        #ui { position: absolute; top: 45px; width: 100%; display: flex; justify-content: space-around; z-index: 100; pointer-events: none; }
        .badge { background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); font-size: 13px; min-width: 80px; text-align: center; }
        
        .screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 50; text-align: center; padding: 20px; }
        #splash { display: flex; z-index: 200; background: #000; }
        
        .btn { padding: 18px 45px; background: #0088cc; border: none; border-radius: 20px; color: white; font-weight: 800; font-size: 18px; margin: 10px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        
        /* Игровые модули */
        #stage { position: absolute; inset: 0; display: none; }
        .card { width: 130px; height: 130px; background: white; border-radius: 35px; display: flex; align-items: center; justify-content: center; font-size: 70px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 40px rgba(255,255,255,0.2); }
        
        /* Трубопровод */
        #pipe-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 20px; width: 90%; max-width: 400px; }
        .pipe { background: rgba(255,255,255,0.1); height: 100px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 50px; cursor: pointer; transition: 0.3s; }
        
        /* Наперстки */
        .pot-container { display: flex; gap: 15px; }
        .pot { font-size: 80px; cursor: pointer; transition: 0.3s; }
        
        #runner-fly { position: absolute; bottom: 60px; font-size: 60px; transition: 0.15s; z-index: 10; }
        .obs { position: absolute; font-size: 50px; }
        
        #fruit-canvas { position: absolute; inset: 0; pointer-events: none; }
    </style>
</head>
<body>

<div id="game-container" class="side-kots">
    <div id="ui">
        <div class="badge">🪰 <span id="fly-pts">0</span></div>
        <div class="badge" id="timer">⏳ 30.0</div>
        <div class="badge">🥩 <span id="kot-pts">0</span></div>
    </div>

    <div id="splash" class="screen">
        <h1 style="font-size: 32px;">МУХИ VS КОТЛЕТЫ<br><span style="color: #0088cc; font-size: 20px;">ГЛАВА 1: НАСЛЕДИЕ</span></h1>
        <button class="btn" onclick="nextLvl(0)">НАЧАТЬ</button>
    </div>

    <div id="intro" class="screen" style="background: rgba(0,0,0,0.92);">
        <h2 id="l-title" style="color: #0088cc;"></h2>
        <p id="l-desc" style="font-size: 16px; opacity: 0.9; line-height: 1.4;"></p>
        <p id="l-tip" style="color: #ffcc00; font-weight: bold;"></p>
        <button class="btn" onclick="startGame()">ПОНЯТНО</button>
    </div>

    <div id="stage">
        <div id="mod-sort" style="height:100%; display:none;">
            <div style="width:50%; height:100%; float:left;" onclick="tap('left')"></div>
            <div style="width:50%; height:100%; float:left;" onclick="tap('right')"></div>
            <div class="card" id="card">🥩</div>
        </div>

        <div id="mod-pipe" style="height:100%; display:none; flex-direction:column; align-items:center; justify-content:center;">
            <div id="pipe-grid"></div>
        </div>

        <div id="mod-luck" style="height:100%; display:none; flex-direction:column; align-items:center; justify-content:center;">
            <div class="pot-container" id="pot-wrap"></div>
        </div>

        <div id="mod-run" style="height:100%; display:none;">
            <div id="runner-fly">🪰</div>
            <div style="display:flex; height:100%;">
                <div onclick="mv(0)" style="flex:1"></div>
                <div onclick="mv(1)" style="flex:1"></div>
                <div onclick="mv(2)" style="flex:1"></div>
            </div>
        </div>
    </div>

    <div id="finish" class="screen" style="background: rgba(0,0,0,0.95);">
        <h1 id="f-res"></h1>
        <p id="f-body"></p>
        <button class="btn" id="f-btn"></button>
    </div>
</div>

<script>
    let curIdx = -1;
    let flyTotal = 0, kotTotal = 0, lvlScore = 0;
    let gameOn = false, time = 30, pLane = 1;
    let loop, spawn;

    const levels = [
        { t: "1. Заготовка", side: "kots", mod: "sort", d: "Сортируй: Еда — направо, Иван — налево!", goal: 20 },
        { t: "2. Путь на базар", side: "fly", mod: "run", d: "Лети! Количество людей зависит от того, сколько котлет ты собрал.", goal: 15 },
        { t: "3. Инвестиция", side: "kots", mod: "luck", d: "Угадай, в какой кастрюле золотая монета.", goal: 1 },
        { t: "4. Сборка самовара", side: "fly", mod: "pipe", d: "Поверни сегменты труб так, чтобы кран смотрел вниз (0°).", goal: 1 },
        { t: "5. Чистка", side: "kots", mod: "sort", d: "Быстро чисти самовар! Кликай только на блестящие зоны.", goal: 25 },
        { t: "6. Полет домой", side: "fly", mod: "run", d: "Собери 50 котлет. При достижении цели Муха станет Слоном!", goal: 50 },
        { t: "7. Где Слон?", side: "kots", mod: "luck", d: "Слон спрятался! Найди его под одной из крышек.", goal: 1 },
        { t: "8. Ниндзя-Паутина", side: "fly", mod: "sort", d: "Разрезай паутину быстрыми свайпами по сторонам!", goal: 30 },
        { t: "13. Финал: Баланс", side: "balance", mod: "final", d: "Решающая битва!", goal: 0 }
    ];

    function nextLvl(i) {
        curIdx = i; gameOn = false;
        const l = levels[i];
        document.getElementById('splash').style.display = 'none';
        document.getElementById('finish').style.display = 'none';
        document.getElementById('intro').style.display = 'flex';
        document.getElementById('game-container').className = 'side-' + l.side;
        document.getElementById('l-title').innerText = l.t;
        document.getElementById('l-desc').innerText = l.d;
        document.getElementById('l-tip').innerText = i === 1 ? `Сложность: ${Math.floor(kotTotal/4)+2} чел.` : "";
    }

    function startGame() {
        document.getElementById('intro').style.display = 'none';
        document.getElementById('stage').style.display = 'block';
        lvlScore = 0; time = 30; gameOn = true;
        
        const m = levels[curIdx].mod;
        document.querySelectorAll('#stage > div').forEach(d => d.style.display = 'none');
        document.getElementById('mod-' + m).style.display = m === 'pipe' ? 'flex' : (m === 'luck' ? 'flex' : 'block');

        if(m === 'sort') nextCard();
        if(m === 'pipe') initPipes();
        if(m === 'luck') initLuck();
        if(m === 'run') initRunner();
        if(m === 'final') showFinal();

        loop = setInterval(() => {
            time -= 0.1;
            document.getElementById('timer').innerText = "⏳ " + Math.max(0, time).toFixed(1);
            if(time <= 0) end(false);
        }, 100);
    }

    // --- Модули механик ---
    let cardType = '';
    function nextCard() {
        const c = document.getElementById('card');
        const r = Math.random();
        cardType = r < 0.3 ? 'ivan' : 'eda';
        c.innerText = cardType === 'ivan' ? '😷' : (Math.random() > 0.5 ? '🥩' : '🍔');
    }

    function tap(s) {
        if(!gameOn) return;
        if((cardType === 'ivan' && s === 'left') || (cardType === 'eda' && s === 'right')) {
            lvlScore++; updateStats();
            if(lvlScore >= levels[curIdx].goal) end(true);
            nextCard();
        } else { time -= 1; }
    }

    function initPipes() {
        const g = document.getElementById('pipe-grid'); g.innerHTML = '';
        for(let i=0; i<9; i++) {
            let p = document.createElement('div'); p.className = 'pipe';
            let r = Math.floor(Math.random()*4)*90;
            p.style.transform = `rotate(${r}deg)`; p.dataset.r = r; p.innerText = '🚀';
            p.onclick = () => {
                let nr = parseInt(p.dataset.r) + 90; p.style.transform = `rotate(${nr}deg)`; p.dataset.r = nr;
                if([...document.querySelectorAll('.pipe')].every(el => parseInt(el.dataset.r)%360 === 0)) end(true);
            };
            g.appendChild(p);
        }
    }

    function initLuck() {
        const w = document.getElementById('pot-wrap'); w.innerHTML = '';
        const win = Math.floor(Math.random()*3);
        for(let i=0; i<3; i++) {
            let p = document.createElement('div'); p.className = 'pot'; p.innerText = '🍯';
            p.onclick = () => {
                if(i === win) { p.innerText = '🌟'; setTimeout(() => end(true), 600); }
                else { p.innerText = '😷'; setTimeout(() => end(false), 600); }
            };
            w.appendChild(p);
        }
    }

    function initRunner() {
        pLane = 1; mv(1);
        const isL6 = curIdx === 5;
        spawn = setInterval(() => {
            const ln = Math.floor(Math.random()*3);
            const o = document.createElement('div'); o.className = 'obs';
            o.style.left = (ln * 33 + 10) + '%'; o.style.top = '-50px';
            o.innerText = isL6 ? '🥩' : '🚶';
            document.getElementById('mod-run').appendChild(o);
            let y = -50;
            let m = setInterval(() => {
                y += 6; o.style.top = y + 'px';
                if(y > window.innerHeight - 130 && ln === pLane) {
                    if(isL6) { lvlScore++; updateStats(); o.remove(); clearInterval(m); if(lvlScore >= 50) { document.getElementById('runner-fly').innerText = '🐘'; setTimeout(()=>end(true), 500); } }
                    else { end(false); }
                }
                if(y > window.innerHeight || !gameOn) { o.remove(); clearInterval(m); }
            }, 20);
        }, curIdx === 1 ? 900 - (kotTotal*8) : 700);
    }

    function mv(l) { pLane = l; document.getElementById('runner-fly').style.left = (l*33+10)+'%'; }

    function updateStats() {
        if(levels[curIdx].side === 'fly') flyTotal++; else if(levels[curIdx].side === 'kots') kotTotal++;
        document.getElementById('fly-pts').innerText = flyTotal;
        document.getElementById('kot-pts').innerText = kotTotal;
    }

    function end(win) {
        gameOn = false; clearInterval(loop); clearInterval(spawn);
        document.getElementById('stage').style.display = 'none';
        const f = document.getElementById('finish'); f.style.display = 'flex';
        document.getElementById('f-res').innerText = win ? "ПОБЕДА!" : "ПРОИГРЫШ";
        document.getElementById('f-body').innerText = win ? "Вы отлично справились с задачей." : "Попробуйте еще раз!";
        const b = document.getElementById('f-btn');
        if(win) { b.innerText = "ДАЛЬШЕ"; b.onclick = () => nextLvl(curIdx + 1); }
        else { b.innerText = "ПОВТОР"; b.onclick = () => nextLvl(curIdx); }
    }

    function showFinal() {
        const win = flyTotal > kotTotal ? "МУХИ" : "КОТЛЕТЫ";
        document.getElementById('f-res').innerText = "ИТОГ: Победили " + win;
        document.getElementById('f-body').innerText = flyTotal > kotTotal ? "Слон захватил кухню!" : "Иван съел все котлеты и доволен.";
        document.getElementById('f-btn').innerText = "ЗАНОВО";
        document.getElementById('f-btn').onclick = () => location.reload();
    }
</script>
</body>
</html>
    </div>

    <div id="game-area">
        <div id="info-bar">
            <div id="timer-ui" class="info-item">⏳ 0.0с</div>
            <div id="score-ui" class="info-item">🏆 0</div>
            <div id="err-ui" class="info-item">❌ 0/5</div>
        </div>

        <div id="standard-mode" style="display:flex; height:100%; width:100%">
            <div class="tap-zone" id="zone-left" onclick="handleInput('left')">
                <span class="zone-hint" id="hint-l">МУХИ</span>
                <span class="pub-hint" id="pub-l">🍺 ПИВНУШКА</span>
            </div>
            <div class="tap-zone" id="zone-right" onclick="handleInput('right')">
                <span class="zone-hint" id="hint-r">КОТЛЕТЫ</span>
                <span class="pub-hint" id="pub-r">🍺 ПИВНУШКА</span>
            </div>
            <div class="card-container"><div id="card" class="card">🍔</div></div>
        </div>

        <div id="samovar-mode" style="display:none; align-items:center; justify-content:center; flex-direction:column; width:100%; height:100%;">
            <div id="samovar-clicker" onclick="clickSamovar()">🏺</div>
            <p style="font-weight:bold; color:#0088cc; font-size:18px">ЧИСТЬ ЕГО!</p>
        </div>

        <div id="runner-mode">
            <div class="lane" onclick="moveRunner(0)"></div><div class="lane" onclick="moveRunner(1)"></div><div class="lane" onclick="moveRunner(2)"></div>
            <div id="player-fly">🪰</div>
        </div>

        <div id="meme-area">
            <div class="meme-lane" id="ml-0"></div><div class="meme-lane" id="ml-1"></div><div class="meme-lane" id="ml-2"></div>
            <button class="meme-btn" style="left:0" onclick="hitMeme(0)">🥩 Котлетки</button>
            <button class="meme-btn" style="left:33.3%" onclick="hitMeme(1)">🍝 Макарошки</button>
            <button class="meme-btn" style="left:66.6%" onclick="hitMeme(2)">🥔 Пюрешка</button>
        </div>
        <div id="search-mode"></div>
    </div>

    <div id="finish-overlay" class="overlay"><div id="finish-content"></div><button class="btn-ui" onclick="showMenu()">В МЕНЮ</button></div>

    <audio id="snd-success" src="success.mp3"></audio>
    <audio id="snd-error" src="error.mp3"></audio>
    <audio id="snd-error1" src="error1.mp3"></audio>
    <audio id="snd-ivan" src="ivan.mp3"></audio>
    <audio id="snd-win" src="win.mp3"></audio>
    <audio id="snd-lose" src="lose.mp3"></audio>

    <script>
        const tg = window.Telegram.WebApp;
        let unlocked = parseInt(localStorage.getItem('unlocked_v13')) || 1;
        let globalPts = parseFloat(localStorage.getItem('global_pts')) || 0;
        let globalKots = parseInt(localStorage.getItem('global_kots')) || 0;
        let curLvl, points, timeLeft, errors, gameActive, gameStarted, lvlKots, loop, runnerInt, spawnInt, pLane, curEmoji, ivanSide;

        const levelData = [
            { t: "Сортировка: Начало", d: "Мухи — налево, Котлеты — направо. Набери 20 баллов.", time: 30 },
            { t: "Внимание: Иван!", d: "Опасность! Если видишь Ивана — отправляй его в Пивнушку. Набери 35.", time: 25 },
            { t: "Золотая монета", d: "Найди 🪙 среди КУЧИ движущихся коробок!", time: 15 },
            { t: "Никита у плиты", d: "💩 (Никита) — в мусор, 🥯 (Еда) — в котел. Набери 15.", time: 30 },
            { t: "Где слон?", d: "Слон 🐘 постоянно прячется и прыгает! Поймай его.", time: 20 },
            { t: "Чистка самовара", d: "Кликай по самовару быстро! Нужно 50 кликов.", time: 15 },
            { t: "Паутина", d: "Пауки 🕷️ — налево, Щиты 🛡️ — направо. Набери 20.", time: 30 },
            { t: "Полёт за обедом", d: "Собирай макарошки 🍝. Избегай веников 🧹!", time: 40 },
            { t: "Чаепитие", d: "Гости 👥 — налево, Чай ☕ — направо. Набери 20.", time: 35 },
            { t: "БИТВА ЗА ПЮРЕШКУ", d: "ФИНАЛ! Попадай в ритм. Набери 100.", time: 45 }
        ];

        function doCalc() {
            let a = parseInt(document.getElementById('calcA').value), b = parseInt(document.getElementById('calcB').value), n = document.getElementById('calcD').value;
            let out = document.getElementById('calcOutput');
            if(!a || !b || !n) return out.innerText = "Заполни все поля!";
            let name = n.toLowerCase();
            if(name.startsWith('гал')) return out.innerText = `Ты в отпуске перегрелась, ${n}, мухи отдельно!`;
            if(name === 'никита') return out.innerText = "Никита, говна поешь!";
            let mTotal = Math.floor(6071 * 1.5 * a * b);
            let kTotal = Math.floor(mTotal / 45);
            out.innerText = `Нужно ${kTotal} котлет, чтобы накормить ${a} чел. на ${b} дн.`;
        }

        function play(id) { 
            if(id === 'snd-error' && Math.random() > 0.5) id = 'snd-error1';
            const s = document.getElementById(id); 
            if(s) { s.currentTime = 0; s.play().catch(()=>{}); } 
        }

        function showMenu() {
            hideModes(); document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('finish-overlay').style.display = 'none';
            document.getElementById('game-area').style.display = 'none';
            document.getElementById('menu-overlay').style.display = 'flex';
            const grid = document.getElementById('levels-grid'); grid.innerHTML = '';
            levelData.forEach((l, i) => {
                let div = document.createElement('div'); div.className = `level-card ${i < unlocked ? 'open' : ''}`;
                div.innerText = i < unlocked ? l.t : '🔒';
                if(i < unlocked) div.onclick = () => { curLvl = i + 1; showIntro(); };
                grid.appendChild(div);
            });
            document.getElementById('gs-pts').innerText = globalPts.toFixed(0);
            document.getElementById('gs-kots').innerText = globalKots;
        }

        function showIntro() {
            document.getElementById('intro-title').innerText = levelData[curLvl-1].t;
            document.getElementById('intro-desc').innerText = levelData[curLvl-1].d;
            document.getElementById('intro-overlay').style.display = 'flex';
        }

        function realStart() {
            document.getElementById('intro-overlay').style.display = 'none';
            document.getElementById('menu-overlay').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            points = 0; errors = 0; lvlKots = 0; gameActive = true; gameStarted = false;
            timeLeft = levelData[curLvl-1].time; updateUI();
            if([3, 5].includes(curLvl)) initSearch(curLvl===3?'🪙':'🐘', curLvl===3);
            else if(curLvl === 6) { document.getElementById('samovar-mode').style.display = 'flex'; startTimer(); }
            else if(curLvl === 8) { document.getElementById('runner-mode').style.display = 'block'; initRunner(); }
            else if(curLvl === 10) { document.getElementById('meme-area').style.display = 'block'; initMeme(); }
            else { document.getElementById('standard-mode').style.display = 'flex'; nextItem(); }
        }

        function nextItem() {
            const c = document.getElementById('card'); c.className = 'card'; resetHints();
            const hl = document.getElementById('hint-l'), hr = document.getElementById('hint-r');
            if(curLvl === 4) { hl.innerText = "НИКИТА\n(В МУСОР)"; hr.innerText = "ЕДА\n(В КОТЕЛ)"; curEmoji = Math.random() > 0.5 ? 'left' : 'right'; c.innerText = curEmoji === 'left' ? '💩' : '🥯'; }
            else if(curLvl === 7) { hl.innerText = "ПАУКИ"; hr.innerText = "ЩИТЫ"; curEmoji = Math.random() > 0.5 ? 'left' : 'right'; c.innerText = curEmoji === 'left' ? '🕷️' : '🛡️'; }
            else if(curLvl === 9) { hl.innerText = "ГОСТИ"; hr.innerText = "ЧАЙ"; curEmoji = Math.random() > 0.5 ? 'left' : 'right'; c.innerText = curEmoji === 'left' ? '👥' : '☕'; }
            else {
                hl.innerText = "МУХИ"; hr.innerText = "КОТЛЕТЫ";
                if(curLvl === 2 && Math.random() < 0.25) { 
                    curEmoji = 'ivan'; c.innerText = '😷'; play('snd-ivan'); ivanSide = Math.random() > 0.5 ? 'left' : 'right';
                    document.getElementById('pub-' + (ivanSide === 'left' ? 'l' : 'r')).style.display = 'block';
                    document.getElementById('zone-' + ivanSide).style.background = '#ffd600';
                } else { curEmoji = Math.random() > 0.5 ? 'right' : 'left'; c.innerText = curEmoji === 'right' ? '🍔' : '🪰'; }
            }
            hl.style.display = hr.style.display = 'block';
        }

        function resetHints() {
            ['l','r'].forEach(s => { document.getElementById('pub-'+s).style.display='none'; document.getElementById('hint-'+s).style.display='none'; });
            document.getElementById('zone-left').style.background = '#ffdde1'; document.getElementById('zone-right').style.background = '#d1e8ff';
        }

        function clickSamovar() { if(!gameActive) return; points++; play('snd-success'); updateUI(); if(points >= 50) endGame('win'); }

        function handleInput(side) {
            if(!gameActive || curLvl === 6) return; if(!gameStarted) startTimer();
            const c = document.getElementById('card'); c.classList.add(side === 'left' ? 'fly-left' : 'fly-right');
            let ok = (curEmoji === 'ivan') ? (side === ivanSide) : (side === curEmoji);
            if(ok) { points++; if(curEmoji === 'right') lvlKots++; play('snd-success'); } else { errors++; play('snd-error'); if(errors >= 5) endGame('lose'); }
            updateUI(); let target = [20, 35, 0, 15, 0, 0, 20, 0, 20, 0][curLvl-1];
            if(target > 0 && points >= target) endGame('win'); else setTimeout(nextItem, 200);
        }

        function startTimer() { gameStarted = true; loop = setInterval(() => { timeLeft -= 0.1; updateUI(); if(timeLeft <= 0) endGame(points >= 10 ? 'win' : 'lose'); }, 100); }

        function initSearch(emo, isCoin) {
            const area = document.getElementById('search-mode'); area.innerHTML = ''; area.style.display = 'block';
            const boxCount = isCoin ? 45 : 20;
            for(let i=0; i<boxCount; i++) {
                let d = document.createElement('div'); d.innerText = '📦'; d.className = isCoin ? 'box-drift' : '';
                d.style.cssText = `position:absolute; font-size:45px; left:${Math.random()*85}%; top:${20+Math.random()*60}%`;
                if(isCoin) d.style.animationDelay = Math.random()*2+'s'; area.appendChild(d);
            }
            let t = document.createElement('div'); t.innerText = emo; t.style.cssText = `position:absolute; font-size:55px; left:50%; top:50%; z-index:100; cursor:pointer`;
            t.onclick = () => endGame('win'); area.appendChild(t);
            if(!isCoin) { spawnInt = setInterval(() => { t.style.left = Math.random()*85+'%'; t.style.top = (20+Math.random()*60)+'%'; }, 750); }
            startTimer();
        }

        function initRunner() {
            pLane = 1; updateFly(); startTimer();
            runnerInt = setInterval(() => {
                let l = Math.floor(Math.random()*3); let item = document.createElement('div'); item.className = 'falling-item';
                item.innerText = Math.random() > 0.7 ? '🧹' : '🍝'; document.querySelectorAll('.lane')[l].appendChild(item);
                let y = -100; let m = setInterval(() => {
                    y += 7; item.style.top = y + 'px';
                    if(y > window.innerHeight - 200 && y < window.innerHeight - 100 && l === pLane) {
                        if(item.innerText === '🧹') endGame('lose'); else { points++; lvlKots++; play('snd-success'); updateUI(); }
                        clearInterval(m); item.remove();
                    }
                    if(y > window.innerHeight) { clearInterval(m); item.remove(); }
                }, 20);
            }, 700);
        }

        function moveRunner(p) { pLane = p; updateFly(); }
        function updateFly() { document.getElementById('player-fly').style.left = (16.6 + pLane * 33.3) + '%'; }

        function initMeme() {
            startTimer();
            spawnInt = setInterval(() => {
                const l = Math.floor(Math.random()*3); const f = document.createElement('div'); f.className = 'falling-item'; f.innerText = ['🥩','🍝','🥔'][l];
                document.getElementById('ml-'+l).appendChild(f);
                let y = -100; let m = setInterval(() => {
                    y += 6; f.style.top = y + 'px'; if(y > window.innerHeight - 180 && y < window.innerHeight - 80) f.dataset.active = "true";
                    if(y > window.innerHeight) { f.remove(); clearInterval(m); }
                }, 20);
            }, 600);
        }

        function hitMeme(l) {
            const active = document.getElementById('ml-'+l).querySelector('.falling-item[data-active="true"]');
            if(active) { active.remove(); points += 5; lvlKots++; play('snd-success'); } else points = Math.max(0, points-2);
            updateUI(); if(points >= 100) endGame('win');
        }

        function updateUI() { document.getElementById('timer-ui').innerText = `⏳ ${Math.max(0, timeLeft).toFixed(1)}`; document.getElementById('score-ui').innerText = `🏆 ${points}`; document.getElementById('err-ui').innerText = `❌ ${errors}/5`; }
        function hideModes() { ['standard-mode', 'runner-mode', 'meme-area', 'search-mode', 'samovar-mode'].forEach(id => document.getElementById(id).style.display = 'none'); clearInterval(loop); clearInterval(runnerInt); clearInterval(spawnInt); }
        function toggleCalc(s) { document.getElementById('calc-overlay').style.display = s ? 'flex' : 'none'; }
        function hideMenu() { document.getElementById('menu-overlay').style.display = 'none'; document.getElementById('splash-screen').style.display = 'flex'; }

        function endGame(r) {
            gameActive = false; hideModes(); let win = r === 'win';
            if(win) { if(curLvl === unlocked) unlocked++; globalPts += points; globalKots += lvlKots; localStorage.setItem('unlocked_v13', unlocked); localStorage.setItem('global_pts', globalPts); localStorage.setItem('global_kots', globalKots); play('snd-win'); } else play('snd-lose');
            document.getElementById('finish-content').innerHTML = `<h1>${win ? 'ПОБЕДА' : 'ПРОИГРЫШ'}</h1><p>Баллы: ${points}</p>`;
            document.getElementById('finish-overlay').style.display = 'flex';
        }

        // --- Управление ---
        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, false);

        document.addEventListener('touchend', e => {
            if(!gameActive) return;
            let x = e.changedTouches[0].screenX;
            let y = e.changedTouches[0].screenY;
            let dx = x - touchStartX;
            let dy = y - touchStartY;

            if(Math.abs(dx) > 30 || Math.abs(dy) > 30) {
                if(Math.abs(dx) > Math.abs(dy)) {
                    // Горизонтальный свайп
                    if(dx > 0) { // Вправо
                        if(curLvl === 8) moveRunner(Math.min(2, pLane+1));
                        else if(curLvl === 10) hitMeme(2);
                        else handleInput('right');
                    } else { // Влево
                        if(curLvl === 8) moveRunner(Math.max(0, pLane-1));
                        else if(curLvl === 10) hitMeme(0);
                        else handleInput('left');
                    }
                } else {
                    // Вертикальный свайп
                    if(dy < 0 && curLvl === 10) hitMeme(1); // Вверх
                }
            }
        }, false);

        document.addEventListener('keydown', e => {
            if(!gameActive) return;
            if(curLvl === 8) { if(e.key === 'ArrowLeft') moveRunner(Math.max(0, pLane-1)); if(e.key === 'ArrowRight') moveRunner(Math.min(2, pLane+1)); }
            else if(curLvl === 10) { if(e.key === '1') hitMeme(0); if(e.key === '2') hitMeme(1); if(e.key === '3') hitMeme(2); }
            else { if(e.key === 'ArrowLeft') handleInput('left'); if(e.key === 'ArrowRight') handleInput('right'); }
        });

        showMenu();
    </script>
</body>
</html>
